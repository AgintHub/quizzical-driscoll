dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow from UI
nodes:
  create_daily_schedule_template:
    agent: false
    description: Create a basic daily schedule template.
    name: create_daily_schedule_template
    nodes_depended_on:
    - identify_family_routines
    nodes_dependent_on: []
    prompt: Create a basic daily schedule template that includes time slots for meals,
      sleep, and activities for the family.
  determine_childcare_needs:
    agent: false
    description: Assess the childcare needs for the children.
    name: determine_childcare_needs
    nodes_depended_on:
    - identify_family_routines
    nodes_dependent_on: []
    prompt: Based on the family routines, assess the childcare needs for the children,
      including the need for daycare, babysitting, or other care arrangements.
  finalize_daily_schedule:
    agent: false
    description: Finalize the daily schedule for the family.
    name: finalize_daily_schedule
    nodes_depended_on:
    - plan_morning_routine
    - plan_afternoon_routine
    - plan_evening_routine
    - integrate_childcare_arrangements
    nodes_dependent_on: []
    prompt: Combine the morning, afternoon, and evening routines, along with childcare
      arrangements, into a comprehensive daily schedule for the family.
  identify_family_routines:
    agent: false
    description: List the daily routines and activities for the family.
    name: identify_family_routines
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the daily routines and activities for a family with two young children
      ages 1 and 6, including meal times, sleep schedules, and regular activities.
  integrate_childcare_arrangements:
    agent: false
    description: Integrate childcare arrangements into the daily schedule.
    name: integrate_childcare_arrangements
    nodes_depended_on:
    - determine_childcare_needs
    - plan_afternoon_routine
    nodes_dependent_on: []
    prompt: Integrate the assessed childcare needs into the afternoon routine, including
      daycare or babysitting arrangements.
  plan_afternoon_routine:
    agent: false
    description: Plan the afternoon routine for the family.
    name: plan_afternoon_routine
    nodes_depended_on:
    - create_daily_schedule_template
    nodes_dependent_on: []
    prompt: Using the daily schedule template, plan an afternoon routine that includes
      lunch, activities, and childcare arrangements.
  plan_evening_routine:
    agent: false
    description: Plan the evening routine for the family.
    name: plan_evening_routine
    nodes_depended_on:
    - create_daily_schedule_template
    nodes_dependent_on: []
    prompt: Using the daily schedule template, plan an evening routine that includes
      dinner, relaxation, and bedtime preparations.
  plan_morning_routine:
    agent: false
    description: Plan the morning routine for the family.
    name: plan_morning_routine
    nodes_depended_on:
    - create_daily_schedule_template
    nodes_dependent_on: []
    prompt: Using the daily schedule template, plan a morning routine that includes
      waking up, breakfast, and getting ready for the day.
  review_and_adjust_schedule:
    agent: false
    description: Review and adjust the daily schedule as needed.
    name: review_and_adjust_schedule
    nodes_depended_on:
    - finalize_daily_schedule
    nodes_dependent_on: []
    prompt: Review the finalized daily schedule for feasibility and make adjustments
      as necessary to ensure it meets the family's needs.
