dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow from UI
nodes:
  compile_daily_schedule:
    agent: false
    description: Compile the daily schedule for the busy mom
    name: compile_daily_schedule
    nodes_depended_on:
    - determine_childrens_schedule
    - plan_moms_work_schedule
    - schedule_household_chores
    - plan_meals_and_snacks
    - create_self_care_time
    nodes_dependent_on: []
    prompt: Combine the schedules for the children, mom's work, household chores,
      meals, and self-care into a comprehensive daily schedule.
  create_self_care_time:
    agent: false
    description: Schedule time for the mom's self-care
    name: create_self_care_time
    nodes_depended_on:
    - plan_moms_work_schedule
    nodes_dependent_on: []
    prompt: Schedule time for the mom's self-care, including exercise, relaxation,
      and hobbies, that fits around her work schedule and family responsibilities.
  determine_childrens_schedule:
    agent: false
    description: Determine the daily schedule for the children
    name: determine_childrens_schedule
    nodes_depended_on:
    - identify_daily_routines
    nodes_dependent_on: []
    prompt: Create a daily schedule for the 1-year-old and 6-year-old, including times
      for waking up, meals, naps, school, and bedtime.
  identify_daily_routines:
    agent: false
    description: List the daily routines that need to be included in the schedule
    name: identify_daily_routines
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the daily routines for a busy mom with two young children, such as
      waking up, breakfast, school, work, chores, and bedtime.
  plan_meals_and_snacks:
    agent: false
    description: Plan healthy meals and snacks for the family
    name: plan_meals_and_snacks
    nodes_depended_on:
    - schedule_household_chores
    nodes_dependent_on: []
    prompt: Create a meal plan for the family, including breakfast, lunch, dinner,
      and snacks, that is healthy and can be prepared within the scheduled time.
  plan_moms_work_schedule:
    agent: false
    description: Plan the mom's work schedule around the children's needs
    name: plan_moms_work_schedule
    nodes_depended_on:
    - determine_childrens_schedule
    nodes_dependent_on: []
    prompt: Create a daily work schedule for the mom that takes into account the children's
      schedule, including times for work, breaks, and self-care.
  review_and_adjust_schedule:
    agent: false
    description: Review and adjust the daily schedule as needed
    name: review_and_adjust_schedule
    nodes_depended_on:
    - compile_daily_schedule
    nodes_dependent_on: []
    prompt: Review the daily schedule for feasibility and make any necessary adjustments
      to ensure it is realistic and workable.
  schedule_household_chores:
    agent: false
    description: Schedule household chores and responsibilities
    name: schedule_household_chores
    nodes_depended_on:
    - plan_moms_work_schedule
    nodes_dependent_on: []
    prompt: Create a schedule for household chores, including laundry, cleaning, and
      meal preparation, that fits around the mom's work schedule and the children's
      needs.
