dag_type: plain_text
description: Generated workflow from UI.
name: busy_mom_schedule
nodes:
  create_meal_plan:
    agent: false
    description: Create a meal plan for the family
    name: create_meal_plan
    nodes_depended_on:
    - identify_family_routines
    nodes_dependent_on:
    - integrate_schedules
    prompt: Develop a meal plan that accommodates the family's daily routines and
      dietary needs.
  create_mom_selfcare_schedule:
    agent: false
    description: Create a self-care schedule for the mom
    name: create_mom_selfcare_schedule
    nodes_depended_on:
    - schedule_childcare
    nodes_dependent_on:
    - integrate_schedules
    prompt: Develop a self-care schedule for the mom that fits around the childcare
      schedule.
  determine_childcare_needs:
    agent: false
    description: Determine childcare needs for the children
    name: determine_childcare_needs
    nodes_depended_on:
    - identify_family_routines
    nodes_dependent_on:
    - schedule_childcare
    prompt: Based on the daily routines, determine the childcare needs for the 1 and
      6-year-old children.
  identify_family_routines:
    agent: false
    description: Identify daily routines for the family
    name: identify_family_routines
    nodes_depended_on: []
    nodes_dependent_on:
    - determine_childcare_needs
    - create_meal_plan
    prompt: List the daily routines that need to be accommodated for a family with
      2 young children ages 1 and 6.
  integrate_schedules:
    agent: false
    description: Integrate all schedules into a single family schedule
    name: integrate_schedules
    nodes_depended_on:
    - create_meal_plan
    - schedule_childcare
    - plan_activities_for_children
    - create_mom_selfcare_schedule
    nodes_dependent_on:
    - review_and_adjust_schedule
    prompt: Combine the meal plan, childcare schedule, activities for children, and
      mom's self-care schedule into a single, cohesive family schedule.
  plan_activities_for_children:
    agent: false
    description: Plan activities for the children
    name: plan_activities_for_children
    nodes_depended_on:
    - schedule_childcare
    nodes_dependent_on:
    - integrate_schedules
    prompt: Plan activities for the 1 and 6-year-old children during their scheduled
      childcare times.
  review_and_adjust_schedule:
    agent: false
    description: Review and adjust the family schedule as needed
    name: review_and_adjust_schedule
    nodes_depended_on:
    - integrate_schedules
    nodes_dependent_on: []
    prompt: Review the integrated family schedule and make adjustments as necessary
      to ensure it meets the family's needs.
  schedule_childcare:
    agent: false
    description: Schedule childcare for the children
    name: schedule_childcare
    nodes_depended_on:
    - determine_childcare_needs
    nodes_dependent_on:
    - plan_activities_for_children
    - create_mom_selfcare_schedule
    - integrate_schedules
    prompt: Create a schedule for childcare that meets the determined needs.
